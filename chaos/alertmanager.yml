# One route, to the triage receiver. In a real setup this route sits beside the paging
# route with `continue: true`, so triage never stands between an alert and the pager.
route:
  receiver: alert-triage
  group_by: [service, env]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: alert-triage
    webhook_configs:
      - url: http://triage:9099/alerts
        send_resolved: true
