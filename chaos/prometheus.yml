global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels: {env: prod}

rule_files: [/etc/prometheus/rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: shop
    static_configs:
      - {targets: ["frontend:8000"], labels: {service: frontend}}
      - {targets: ["checkout:8000"], labels: {service: checkout}}
      - {targets: ["payments:8000"], labels: {service: payments}}
      - {targets: ["cart:8000"], labels: {service: cart}}
      - {targets: ["search:8000"], labels: {service: search}}
      - {targets: ["search-index:8000"], labels: {service: search-index}}
      - {targets: ["batch-reports:8000"], labels: {service: batch-reports}}
      - {targets: ["checkout-staging:8000"], labels: {service: checkout, env: staging}}
  - job_name: redis
    static_configs:
      - {targets: ["redis-exporter:9121"], labels: {service: redis-cart}}
