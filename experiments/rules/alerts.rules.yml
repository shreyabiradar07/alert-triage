# The alert rules the simulator fires. Load this file into Prometheus to run the same
# rules against a real stack; simulate.py writes alerts with these names, severities
# and thresholds.
groups:
  - name: services
    rules:
      - alert: HighErrorRate
        expr: sum by (service, env) (rate(http_requests_total{code=~"5.."}[5m])) / sum by (service, env) (rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "HighErrorRate on {{ $labels.service }}"
          description: "5xx ratio for {{ $labels.service }} is {{ $value | humanizePercentage }} over 5m (threshold 5%)"
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum by (le, service, env) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "HighLatencyP99 on {{ $labels.service }}"
          description: "p99 latency for {{ $labels.service }} is {{ $value }}s over 5m (threshold 1s)"
      - alert: TargetDown
        expr: count by (service) (up == 0) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "TargetDown on {{ $labels.service }}"
          description: "{{ $value }} {{ $labels.service }} targets are down"
  - name: pods
    rules:
      - alert: HighCPU
        expr: sum by (pod, service) (rate(container_cpu_usage_seconds_total[5m])) / sum by (pod, service) (kube_pod_container_resource_limits{resource="cpu"}) > 0.85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "HighCPU on {{ $labels.service }}"
          description: "CPU usage of {{ $labels.pod }} is {{ $value | humanizePercentage }} for 5m (threshold 85%)"
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[10m]) >= 3
        labels: {severity: page}
        annotations:
          summary: "PodCrashLooping on {{ $labels.service }}"
          description: "{{ $labels.pod }} restarted {{ $value }} times in 10m"
      - alert: PodOOMKilled
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels: {severity: warning}
        annotations:
          summary: "PodOOMKilled on {{ $labels.service }}"
          description: "{{ $labels.pod }} was OOMKilled"
  - name: infrastructure
    rules:
      - alert: DBConnectionsSaturated
        expr: sum by (service) (pg_stat_activity_count) / sum by (service) (pg_settings_max_connections) > 0.9
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "DBConnectionsSaturated on {{ $labels.service }}"
          description: "{{ $labels.service }} is using {{ $value | humanizePercentage }} of max_connections"
      - alert: ReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "ReplicationLag on {{ $labels.service }}"
          description: "replica lag is {{ $value }}s (threshold 30s)"
      - alert: DiskWillFillSoon
        expr: predict_linear(node_filesystem_avail_bytes[1h], 24 * 3600) < 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "DiskWillFillSoon on {{ $labels.service }}"
          description: "volume {{ $labels.volume }} is predicted to fill within 24h"
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 3m
        labels: {severity: page}
        annotations:
          summary: "NodeNotReady on {{ $labels.node }}"
          description: "{{ $labels.node }} has been NotReady for 3m"
      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        labels: {severity: warning}
        annotations:
          summary: "CertExpiringSoon on {{ $labels.service }}"
          description: "certificate for {{ $labels.instance }} expires in {{ $value }} days (threshold 30d)"
